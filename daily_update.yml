name: Daily News Update

# Refreshes "The Go To" every morning at 6:00 AM Central (11:00 UTC).
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run the news updater
        run: python update_news.py

      - name: Commit fresh edition
        run: |
          git config user.name "go-to-bot"
          git config user.email "go-to-bot@users.noreply.github.com"
          git add stories.json index.html
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
          else
            git commit -m "daily news update $(date -u +%F)"
            git push
          fi
